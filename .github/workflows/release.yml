name: Build and release AutoFete

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}/.dalamud/dev
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download Dalamud development files
        run: |
          mkdir -p "$DALAMUD_HOME"
          curl --fail --location --silent --show-error https://goatcorp.github.io/dalamud-distrib/latest.zip -o "$RUNNER_TEMP/dalamud.zip"
          unzip -q "$RUNNER_TEMP/dalamud.zip" -d "$DALAMUD_HOME"
      - name: Restore and build
        run: |
          dotnet restore AutoFete.csproj --locked-mode -p:EnableWindowsTargeting=true
          dotnet build AutoFete.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true
      - uses: actions/upload-artifact@v4
        with:
          name: AutoFete-package
          path: bin/Release/AutoFete/latest.zip
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AutoFete-package
          path: dist
      - name: Validate package version
        run: |
          release_tag="v$(python3 -c 'from xml.etree import ElementTree; print(ElementTree.parse("AutoFete.csproj").findtext("./PropertyGroup/Version"))')"
          python3 tools/make_repo.py \
            --zip dist/latest.zip \
            --source-url "https://github.com/$GITHUB_REPOSITORY" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$release_tag/latest.zip" \
            --release-tag "$release_tag" \
            --output "$RUNNER_TEMP/repo.json"
      - name: Resolve versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v$(python3 -c 'from xml.etree import ElementTree; print(ElementTree.parse("AutoFete.csproj").findtext("./PropertyGroup/Version"))')"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            if gh release view "$release_tag" --json assets --jq '.assets[].name' | grep -Fxq latest.zip; then
              gh release download "$release_tag" --pattern latest.zip --dir dist --clobber
            else
              gh release upload "$release_tag" dist/latest.zip
            fi
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              git fetch --no-tags origin "refs/tags/$release_tag:refs/tags/$release_tag"
              if [[ "$(git rev-list -n 1 "$release_tag")" != "$GITHUB_SHA" ]]; then
                echo "Tag $release_tag points to a different commit; bump the project version." >&2
                exit 1
              fi
              gh release create "$release_tag" dist/latest.zip --verify-tag --title "AutoFete $release_tag" --generate-notes
            else
              gh release create "$release_tag" dist/latest.zip --target "$GITHUB_SHA" --title "AutoFete $release_tag" --generate-notes
            fi
          fi
          if [[ "$(gh release view "$release_tag" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "$release_tag" --target "$GITHUB_SHA" --draft=false
          fi
      - name: Verify public release asset
        run: |
          asset_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/latest.zip"
          for attempt in {1..6}; do
            if curl --fail --location --silent --head "$asset_url?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Release asset is not publicly available: $asset_url" >&2
          exit 1
      - name: Generate and validate repository index
        run: |
          python3 tools/make_repo.py \
            --zip dist/latest.zip \
            --source-url "https://github.com/$GITHUB_REPOSITORY" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/latest.zip" \
            --release-tag "$RELEASE_TAG" \
            --output site/repo.json
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - name: Deploy repository index to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
